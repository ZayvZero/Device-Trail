<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Device Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EAEE; --surface:#FFFFFF; --surface-2:#F3F5F7; --ink:#14202B; --ink-2:#4A5866; --line:#CBD3DB;
  --accent:#1F5FA8; --accent-ink:#FFFFFF;
  --t-neutral:#7A8794; --t-intake:#1F5FA8; --t-hazard:#D9A400; --t-red:#C2362F; --t-bench:#5B4FC4;
  --t-green:#2E8B57; --t-cpo:#9A5B13; --t-new:#16808A; --t-muted:#9AA6B2; --t-event:#B0397A;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#18212A; --surface-2:#1F2A35; --ink:#E7EDF2; --ink-2:#9FB0BF; --line:#2E3B48;
  --accent:#5B9BE0; --accent-ink:#0B1218; --t-neutral:#8A98A6; --t-intake:#5B9BE0; --t-hazard:#E8BC2C; --t-red:#E2625B;
  --t-bench:#8D84E6; --t-green:#4CB57B; --t-cpo:#C98B45; --t-new:#3BB1BB; --t-muted:#6B7886; --t-event:#E07AB4;
}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#18212A; --surface-2:#1F2A35; --ink:#E7EDF2; --ink-2:#9FB0BF; --line:#2E3B48;
  --accent:#5B9BE0; --accent-ink:#0B1218; --t-neutral:#8A98A6; --t-intake:#5B9BE0; --t-hazard:#E8BC2C; --t-red:#E2625B;
  --t-bench:#8D84E6; --t-green:#4CB57B; --t-cpo:#C98B45; --t-new:#3BB1BB; --t-muted:#6B7886; --t-event:#E07AB4;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:1200px;margin:0 auto}
.brand h1{font-size:1.65rem;font-weight:700;letter-spacing:-.01em}
.brand .who{font-size:.85rem;color:var(--ink-2)}
.scan{max-width:1200px;margin:10px auto 0;display:flex;gap:8px}
.scan input{flex:1;min-width:0;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-size:1.05rem}
.scan input:focus{border-color:var(--accent);outline:none}
.btn{border:0;border-radius:10px;padding:11px 16px;font-family:var(--display);font-weight:600;font-size:1rem;cursor:pointer;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{max-width:1200px;margin:10px auto 0;display:flex;gap:4px}
.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;font-family:var(--display);font-weight:600;font-size:1rem;color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.banner{max-width:1200px;margin:10px auto 0;font-size:.9rem;color:var(--ink-2);background:var(--surface-2);padding:8px 12px;border-radius:8px}
main{max-width:1200px;margin:0 auto;padding:16px}

/* Floor board: the hang-tag columns */
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.loc{background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.loc-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:6px solid var(--tone)}
.loc-head h2{font-size:1.15rem;font-weight:600;flex:1}
.count{font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--tone);line-height:1}
.loc ul{list-style:none;margin:0;padding:0 8px 8px}
.loc li button{width:100%;text-align:left;background:var(--surface-2);border:0;border-radius:8px;padding:9px 10px;margin-top:6px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.loc li button:hover{background:color-mix(in srgb,var(--tone) 14%,var(--surface-2))}
.serial{font-family:var(--display);font-weight:600;font-size:1rem;overflow-wrap:anywhere}
.model{font-size:.85rem;color:var(--ink-2);grid-column:1}
.since{font-size:.8rem;color:var(--ink-2);grid-row:1 / span 2;grid-column:2;align-self:center;text-align:right}
.empty-loc{padding:6px 14px 14px;color:var(--ink-2);font-size:.9rem}
.more{padding:8px 14px 12px;font-size:.85rem;color:var(--ink-2)}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;background:color-mix(in srgb,var(--tone) 16%,transparent);color:var(--ink);white-space:nowrap}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tone)}
.meta{font-size:.85rem;color:var(--ink-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar h2{font-size:1.3rem}
.empty{padding:28px 18px;text-align:center;color:var(--ink-2)}
.empty .btn{margin-top:12px}

/* Sheet */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(640px,100% - 24px);max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,16,22,.55)}
.sheet{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.sheet-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.sheet-head h2{font-size:1.45rem;flex:1;overflow-wrap:anywhere}
.sheet-body{padding:14px 18px 20px;overflow:auto}
.x{background:none;border:0;font-size:1.6rem;line-height:1;padding:2px 6px;cursor:pointer;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem;margin:0 0 14px}
.facts dt{color:var(--ink-2)}
.facts dd{margin:0;overflow-wrap:anywhere}
.section{margin-top:18px}
.section h3{font-size:1.1rem;margin-bottom:8px}
.dest{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.dest button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer;font-size:.92rem;display:flex;gap:8px;align-items:center}
.dest button::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--tone)}
.dest button[aria-pressed="true"]{border-color:var(--tone);background:color-mix(in srgb,var(--tone) 12%,var(--surface))}
label{display:block;font-size:.9rem;font-weight:500;margin:10px 0 4px}
input[type=text],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:1rem}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 14px 16px}
.timeline li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--tone,var(--ink-2));border:2px solid var(--surface)}
.timeline .what{font-weight:600}
.timeline .note{font-size:.9rem;color:var(--ink-2);white-space:pre-wrap}
.dnr{background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:.9rem}
.dnr dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.dnr dt{color:var(--ink-2)}
.dnr dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.nudge{background:color-mix(in srgb,var(--t-hazard) 20%,var(--surface));border-radius:10px;padding:10px 12px;margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.editbox{background:var(--surface-2);border-radius:10px;padding:12px;margin-bottom:12px}.editbox h3{font-size:1.1rem}.editbox .meta{margin:4px 0 0}
.datebar{display:flex;gap:8px}.datebar input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:1rem}
.nudge.soft{background:var(--surface-2);margin:0 0 12px}
.bklist{list-style:none;margin:0;padding:0}.bklist li{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.bklist li.dup{opacity:.75}
.fixrow{display:flex;gap:6px;width:100%}.fixrow input{flex:1;min-width:0;padding:7px 10px}.btn.sm{padding:6px 11px;font-size:.9rem}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--t-event) 16%,transparent);color:var(--ink);border:0;font-family:var(--body);vertical-align:middle}
.tag.back{background:color-mix(in srgb,var(--t-green) 18%,transparent)}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 6px}.tagbar .tag{cursor:pointer;padding:3px 10px;font-size:.8rem}
.nudge.loaner{background:color-mix(in srgb,var(--t-event) 14%,var(--surface));margin:0 0 12px}
.dest button.locked{opacity:.55;border-style:dashed}
.stop{margin-top:10px;padding:12px;border-radius:10px;border:2px solid var(--t-red);background:color-mix(in srgb,var(--t-red) 10%,var(--surface));display:flex;flex-direction:column;gap:4px}
.att{display:inline-block;margin-top:8px}.att img{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);display:block}
input[type=file]{width:100%;font-size:.9rem}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.quick select{width:100%}
.tag.who{background:color-mix(in srgb,var(--t-intake) 18%,transparent)}
.tag.cond.c-needs-repair{background:color-mix(in srgb,var(--t-hazard) 22%,transparent)}.tag.cond.c-defective{background:color-mix(in srgb,var(--t-red) 22%,transparent)}
.tag.cond.c-good,.tag.cond.c-new{background:color-mix(in srgb,var(--t-green) 16%,transparent)}
.tag.arch{background:color-mix(in srgb,var(--t-muted) 30%,transparent)}.tag.void{background:color-mix(in srgb,var(--t-red) 22%,transparent)}
.nudge.shelf{background:var(--surface-2);margin:0 0 12px}
.btn.danger{background:var(--t-red);color:#fff}
.logf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.areabtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-family:var(--display);font-weight:600;cursor:pointer;margin-right:auto}
.chooser{max-width:520px;margin:12px auto;display:flex;flex-direction:column;gap:10px}.chooser h2{font-size:1.4rem}
.areacard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.areacard:hover{border-color:var(--accent)}.areacard .serial{font-size:1.3rem}
[hidden]{display:none!important}
.err{color:var(--t-red);font-size:.9rem;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
@media (max-width:560px){
  .grid2{grid-template-columns:1fr}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92dvh}
  .sheet{max-height:92dvh}
  .brand h1{font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* Plate scanner */
.scanblock{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:6px;background:var(--surface-2)}
.scanblock .lead{font-size:.9rem;color:var(--ink-2);margin:0 0 8px}
.camwrap{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;display:none}
.camwrap.on{display:block}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;left:8%;right:8%;top:38%;height:24%;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
.reticle span{position:absolute;top:-22px;left:0;color:#fff;font:600 .8rem var(--body);text-shadow:0 1px 2px #000}
.scanbar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ocrstat{font-size:.88rem;color:var(--ink-2);margin-top:8px;min-height:1.2em}
.cand{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cand button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;cursor:pointer;font-family:var(--display);font-weight:600}
.cand button:hover{border-color:var(--accent);color:var(--accent)}
.scandebug{margin:8px 0;padding:10px;border:1px dashed var(--line,#999);border-radius:10px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}.scandebug code{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(127,127,127,.15);padding:1px 4px;border-radius:4px}.scandebug .btn{margin-top:6px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Device Trail</h1><button class="areabtn" id="areaBtn" data-act="chooseArea" hidden></button><span class="who" id="who">Service department</span></div>
  <form class="scan" id="scanForm" autocomplete="off">
    <input id="scan" type="search" inputmode="text" placeholder="Scan or type a serial number" aria-label="Scan or type a serial number">
    <button class="btn primary" type="submit">Find</button>
  </form>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="floor">Floor</button>
    <button role="tab" aria-selected="false" data-tab="devices">Devices</button>
    <button role="tab" aria-selected="false" data-tab="holders">Custody</button>
    <button role="tab" aria-selected="false" data-tab="activity">Transfer log</button>
  </nav>
  <div class="banner" id="banner" hidden></div>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const LOCS = [
  {id:"checkin",  name:"Check-in",       tone:"--t-neutral"},
  {id:"intake",   name:"Service",           tone:"--t-intake"},
  {id:"contam",   name:"Contamination closet",     tone:"--t-hazard"},
  {id:"defective",name:"Defective closet",         tone:"--t-red"},
  {id:"bench",    name:"In repair",             tone:"--t-bench"},
  {id:"ready",    name:"Ready devices",  tone:"--t-green"},
  {id:"cpo",      name:"CPO",                tone:"--t-cpo"},
  {id:"newsale",  name:"New",           tone:"--t-new"},
  {id:"event",    name:"Event units",  tone:"--t-event"},
  {id:"customer", name:"Customer units",              tone:"--t-intake"},
  {id:"rep",      name:"Rep units",                 tone:"--t-cpo"},
  {id:"sold",     name:"Sold",                     tone:"--t-new"},
  {id:"shipped",  name:"Returned to manufacturer", tone:"--t-muted"},
];
const LOC = Object.fromEntries(LOCS.map(l=>[l.id,l]));
const UNIT_TYPES=["New","Demo","Loaner","Replacement","CPO"];
const CONDITIONS=["New","Good","Needs repair","Defective"];
// Locations that need a name: who has it
const HOLDER={customer:"customer", sold:"customer", rep:"rep"};
const OUT=["event","customer","rep","sold","shipped"];
const isOut = d => OUT.includes(d.location);
const START_LOCS = LOCS.filter(l=>!OUT.includes(l.id) || l.id==="event");
// Older records used a single "shipped as" tag. Fold it into location and unit type.
function normalize(d){
  if(!d || !d.outAs) return d;
  const t=d.outAs;
  if(d.location==="shipped"){ if(t==="Sold") d.location="sold"; else if(t==="Loaner"||t==="Replacement") d.location="customer"; }
  if(!d.unitType && UNIT_TYPES.includes(t)) d.unitType=t;
  delete d.outAs; return d;
}
function lastMove(d){ const ev=(d.events||[]).filter(e=>e.t==="move"); return ev[ev.length-1]; }
const active=d=>!d.archived && !d.voided;
const slug=s=>String(s||"").toLowerCase().replace(/[^a-z]+/g,"-");
function tagChip(d){
  const t=[];
  if(d.voided) t.push(`<span class="tag void">Voided</span>`); else if(d.archived) t.push(`<span class="tag arch">Archived</span>`);
  if(d.unitType) t.push(`<span class="tag">${esc(d.unitType)}</span>`);
  if(d.condition) t.push(`<span class="tag cond c-${slug(d.condition)}">${esc(d.condition)}</span>`);
  if(HOLDER[d.location] && d.holder) t.push(`<span class="tag who">${esc(d.holder)}</span>`);
  const m=lastMove(d); if(m?.returned && (d.location==="checkin"||d.location==="intake")) t.push(`<span class="tag back">Returned ${esc(m.returned.toLowerCase())}</span>`);
  return t.join(" ");
}
function outText(x){
  const who=x.holder;
  return x.location==="sold" ? `was sold to ${who||"a customer"}`
    : x.location==="customer" ? `is at ${who||"a customer"}${x.unitType?` as a ${x.unitType.toLowerCase()}`:""}`
    : x.location==="rep" ? `is with ${who?"rep "+who:"a rep"}`
    : x.location==="event" ? "is out at an event"
    : "went back to the manufacturer";
}
// Moves that put a device back in front of customers or into sellable stock
const CLEAN_ONLY = ["ready","newsale","cpo","event","customer","rep","sold","shipped"];
// Not cleared: latest DNR that answered the sanitized question said No, and it hasn't left the contamination closet since
function notCleared(d){
  const ev=d.events||[]; let i=ev.length-1;
  for(; i>=0; i--) if(ev[i].t==="dnr" && (ev[i].sanitized==="Yes"||ev[i].sanitized==="No")) break;
  if(i<0 || ev[i].sanitized!=="No") return false;
  return !ev.slice(i+1).some(e=>e.t==="move" && e.from==="contam");
}
const FAIL_TYPES=["Electrical","Mechanical","Optical or laser","Software","Handpiece","Cooling","Cosmetic","No fault found","Other"];
const SOURCES = ["Shipment","Rep return","Customer return","Other"];

const AREAS=[{id:"capital",name:"Capital",desc:"Devices with their own serial: check-in, floor, custody, DNRs"},{id:"bio",name:"Bio",desc:"Biologics by lot, batch, and expiration"},{id:"other",name:"Other",desc:"Anything that doesn't fit the first two"}];
const AKEY="device-trail-area";
const savedArea=(()=>{ try{ return localStorage.getItem(AKEY)||""; }catch{ return ""; } })();
const state = { area:savedArea, tab:"floor", devices:new Map(), mode:"loading", me:null, names:{}, filter:"", holder:null, showShelved:false, log:{type:"move",range:"7",loc:"",who:""}, openId:null, canWrite:true };
let store = null, userCap = null, downloadsCap = null, assetsCap = null, dnrFile = null;
let tessReady=null, camStream=null;
function loadTesseract(){
  if(tessReady) return tessReady;
  tessReady = new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload=()=>res(window.Tesseract); s.onerror=()=>rej(new Error("load"));
    document.head.appendChild(s);
  });
  return tessReady;
}
let zxReady=null, bcTimer=null, bcDetector=null;
function loadZxing(){
  if(zxReady) return zxReady;
  zxReady=new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload=()=>res(window.ZXing); s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); });
  return zxReady;
}
function stopCam(){ clearTimeout(bcTimer); bcTimer=null; if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }


const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tone = id => `--tone:var(${(LOC[id]||LOC.checkin).tone})`;
const now = () => new Date().toISOString();
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function ago(iso){
  if(!iso) return "";
  const m = Math.round((Date.now()-new Date(iso))/60000);
  if(m<1) return "just now"; if(m<60) return m+"m";
  const h=Math.round(m/60); if(h<48) return h+"h";
  return Math.round(h/24)+"d";
}
const stamp = iso => new Date(iso).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }
function nameOf(id){ if(!id) return "Someone"; if(id===state.me) return "You"; return state.names[id] || (id.startsWith("local")?"This device":"Someone"); }

/* ---------- Storage: shared db when available, this browser otherwise ---------- */
const LKEY = "device-trail-v1";
function localAdapter(){
  let subs=[];
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(LKEY)||"{}"); }catch{ return {}; } };
  const emit=()=>{ const all=read(); subs.forEach(f=>f(all)); };
  return {
    subscribe(f){ subs.push(f); f(read()); },
    async save(id,doc){ const all=read(); all[id]=doc; try{ localStorage.setItem(LKEY,JSON.stringify(all)); }catch{ throw {code:"local"}; } emit(); },
  };
}
function dbAdapter(db){
  return {
    subscribe(f){
      db.collection("devices").onSnapshot(snap=>{
        const all={}; snap.docs.forEach(d=>{ if(d.exists) all[d.id]=d.data(); }); f(all);
      }, err=>{ showBanner("Live sync stopped. Reload the page to reconnect."); });
    },
    async save(id,doc){ await db.doc("devices/"+id).set(doc); },
    async fresh(id){ const s=await db.doc("devices/"+id).get(); return s.exists ? s.data() : null; },
  };
}
function showBanner(msg){ const b=$("#banner"); b.textContent=msg; b.hidden=!msg; }

async function boot(){
  render();
  let db=null;
  try{ db = window.claude?.use ? await window.claude.use("db") : null; }catch{ db=null; }
  try{ userCap = window.claude?.use ? await window.claude.use("user") : null; }catch{ userCap=null; }
  try{ downloadsCap = window.claude?.use ? await window.claude.use("downloads") : null; }catch{ downloadsCap=null; }
  try{ assetsCap = window.claude?.use ? await window.claude.use("assets") : null; }catch{ assetsCap=null; }
  if(db){
    store = dbAdapter(db); state.mode="shared";
    try{ state.me = await userCap?.id(); }catch{}
    try{ const w = await userCap?.can?.("data.write"); if(w===false) state.canWrite=false; }catch{}
    if(!state.canWrite) showBanner("You can view the floor but not record transfers. Ask the owner for Contributor access.");
  } else {
    store = localAdapter(); state.mode="local";
    state.me = "local-me";
    showBanner("Saving on this device only. Open the published link in Claude to share records with the team.");
  }
  store.subscribe(all=>{
    Object.values(all).forEach(normalize);
    state.devices = new Map(Object.entries(all));
    resolveNames(); render();
    if(state.openId && $("#dlg").open) openDevice(state.openId, true);
  });
}
async function resolveNames(){
  if(!userCap?.profiles) return;
  const ids=new Set();
  state.devices.forEach(d=>(d.events||[]).forEach(e=>e.by && ids.add(e.by)));
  const missing=[...ids].filter(i=>!(i in state.names) && !i.startsWith("local"));
  if(!missing.length) return;
  try{ const ps=await userCap.profiles(missing); for(const id of missing) state.names[id]=ps[id]?.name||""; render(); }catch{}
}

/* ---------- Helpers on device records ---------- */
function lastMoveInto(d){ const ev=(d.events||[]).filter(e=>e.t==="move"); return ev.length? ev[ev.length-1].at : d.createdAt; }
function sortedDevices(){ return [...state.devices.entries()].map(([id,d])=>({id,...d})).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||"")); }
function findBySerial(s){ s=s.trim().toLowerCase(); for(const [id,d] of state.devices) if(!d.voided && (d.serial||"").toLowerCase()===s) return id; return null; }

async function writeDevice(id, mutate){
  if(!state.canWrite){ toast("You don't have permission to record changes."); return false; }
  let base = store.fresh ? await store.fresh(id).catch(()=>null) : null;
  base = normalize(base || state.devices.get(id));
  const next = structuredClone(base);
  mutate(next); next.updatedAt = now();
  try{ await store.save(id,next); return true; }
  catch(e){
    if(e?.code==="quota_exceeded") toast("Storage is full. Export the log and clear old shipped devices.");
    else if(e?.code==="invalid_argument"){ state.canWrite=false; toast("You can't record changes here. Ask the owner for Contributor access."); }
    else toast("Couldn't save. Check your connection and try again.");
    return false;
  }
}

function holderDetail(h){
  const ds=sortedDevices().filter(d=>active(d) && HOLDER[d.location]===h.kind && (d.holder||"Name not recorded")===h.name);
  const now_=new Set(ds.map(d=>d.id));
  const past=sortedDevices().filter(d=>!d.voided && !now_.has(d.id) && (d.events||[]).some(e=>e.t==="move" && e.holder===h.name && HOLDER[e.to]===h.kind));
  const row=d=>`<button class="row" data-open="${esc(d.id)}"><span class="serial">${esc(d.serial)}</span><span class="chip" style="${tone(d.location)}">${esc(LOC[d.location]?.name)}</span>
    <span class="meta">${esc(d.model||"Unknown model")} ${tagChip(d)}</span><span class="meta">since ${esc(stamp(lastMoveInto(d)))}</span></button>`;
  return `<div class="toolbar"><h2>${h.kind==="rep"?"Rep: ":""}${esc(h.name)} (${ds.length} now)</h2><button class="btn ghost" data-act="clearholder">Back</button></div>

    ${past.length?`<div class="toolbar"><h2>Had before (${past.length})</h2></div><div class="list">${past.map(row).join("")}</div>`:""}`;

const LOG_TYPES=[["move","Transfers"],["dnr","DNR entries"],["changes","Field changes and corrections"],["shelf","Archive and void"],["all","Everything"]];
const LOG_RANGES=[["1","Today"],["7","Last 7 days"],["30","Last 30 days"],["all","All time"]];
function logText(e){
  if(e.t==="move") return (e.from?`${esc(LOC[e.from]?.name)} to ${esc(LOC[e.to]?.name)}`:`Checked in at ${esc(LOC[e.to]?.name)}`)+(e.holder?`: ${esc(e.holder)}`:"")+(e.as?` as ${esc(e.as.toLowerCase())}`:"")+(e.returned?` (returned ${esc(e.returned.toLowerCase())}${e.fromHolder?` from ${esc(e.fromHolder)}`:""})`:"");
  if(e.t==="field") return esc(fieldText(e));
  if(e.t==="edit") return "Details corrected: "+esc(editText(e));
  if(SHELF_TXT[e.t]) return SHELF_TXT[e.t];
  return "DNR form recorded"+(e.failType?`: ${esc(e.failType)}`:"")+(e.failedPart?`, ${esc(e.failedPart)}`:"");
}
function activityView(){
  const L=state.log, rows=[], people=new Set();
  state.devices.forEach((d,id)=>(d.events||[]).forEach(e=>{ rows.push({...e,id,serial:d.serial,model:d.model}); if(e.by) people.add(e.by); }));
  let since="";
  if(L.range==="1"){ const t=new Date(); t.setHours(0,0,0,0); since=t.toISOString(); }
  else if(L.range!=="all") since=new Date(Date.now()-(+L.range)*864e5).toISOString();
  const typeOk=e=> L.type==="all" || (L.type==="move"&&e.t==="move") || (L.type==="dnr"&&e.t==="dnr") || (L.type==="changes"&&(e.t==="field"||e.t==="edit")) || (L.type==="shelf"&&!!SHELF_TXT[e.t]);
  const hits=rows.filter(e=>typeOk(e) && (!since||e.at>=since) && (!L.loc||e.to===L.loc||e.from===L.loc) && (!L.who||e.by===L.who)).sort((a,b)=>b.at.localeCompare(a.at));
  const top=hits.slice(0,150);
  const opt=(list,val)=>list.map(([v,t])=>`<option value="${esc(v)}"${v===val?" selected":""}>${esc(t)}</option>`).join("");
  return `<div class="toolbar"><h2>Transfer log</h2>${downloadsCap?`<button class="btn ghost" data-act="export">Export full log</button>`:""}</div>
  <div class="logf">
    <select data-logf="type" aria-label="What">${opt(LOG_TYPES,L.type)}</select>
    <select data-logf="range" aria-label="When">${opt(LOG_RANGES,L.range)}</select>
    <select data-logf="loc" aria-label="Location">${opt([["","Any location"],...LOCS.map(l=>[l.id,l.name])],L.loc)}</select>
    <select data-logf="who" aria-label="Who">${opt([["","Anyone"],...[...people].map(p=>[p,nameOf(p)])],L.who)}</select>
  </div>
  <p class="meta" style="margin:0 0 8px">${hits.length} ${hits.length===1?"entry":"entries"}${hits.length>top.length?`, showing the newest ${top.length}`:""}. Each device keeps its full trail on its own page.</p>
  <div class="list">${top.length? top.map(e=>`<button class="row" data-open="${esc(e.id)}">
    <span><span class="serial">${esc(e.serial)}</span> <span class="meta">${esc(e.model||"")}</span></span><span class="meta">${esc(stamp(e.at))}</span>
    <span class="meta">${logText(e)}${e.note?` · ${esc(e.note)}`:""}</span>
    <span class="meta">${esc(nameOf(e.by))}</span></button>`).join("") : `<div class="empty">Nothing matches these filters. Widen the date range or pick Everything.</div>`}</div>`;
}

async function bulkScan(val, fmt, engine){
  const stat=$("#ocrstat"); val=String(val).trim(); if(!val) return false;
  if(val===bulkLast.v && Date.now()-bulkLast.at<5000) return false;
  bulkLast={v:val,at:Date.now()};
  if(productOnly(val,fmt)){ const m=guessModel("",gtin14(val)); stat.textContent=`That barcode is a product code${m?` (${m})`:""} with no serial. Type its serial below, or use single check-in for that unit.`; return false; }
  const gs=splitGtinSerial(val); if(gs && !parseGS1(val)?.serial) val="(01)"+gs.gtin+"(21)"+gs.serial;
  const g=parseGS1(val);
  let serial=g?.serial||"";
  if(!serial){ const clean=val.replace(/[\u0000-\u001f]/g," ").trim(); if(/^[A-Za-z0-9\-\/]{4,}$/.test(clean)) serial=clean; }
  if(!serial){ stat.textContent="Read a code but couldn't find a serial in it. Type the serial below."; return false; }
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch{}
  const existing=findBySerial(serial);
  if(existing){ const x=state.devices.get(existing); bulkRows.push({kind:"dup",serial,id:existing}); stat.textContent=x&&isOut(x)?`${serial} ${outText(x)}. Tap Check back in on it below.`:`${serial} is already on file. Skipped.`; renderBulk(); return false; }
  if(!state.canWrite){ stat.textContent="You don't have permission to check in devices."; return false; }

  const doc={serial, model, mfr:mfrFor(model), partNo:"", mfg:g?.mfg||yearFromSerial(serial), gtin:g?.gtin||"", source:segVal("bsource"), sourceNote:$("#bkNote").value.trim(),
    location:loc, unitType:$("#bkType").value, condition:$("#bkCond").value, holder:"", createdAt:at, updatedAt:at, createdBy:state.me, events:[{t:"move",from:null,to:loc,at,by:state.me,note:"Bulk check-in"}]};
  try{ await store.save(id,doc); }catch(ex){ stat.textContent=ex?.code==="quota_exceeded"?"Storage is full. Export the log first.":"Couldn't save that one. Scan it again."; bulkLast.v=""; return false; }
  state.devices.set(id,doc); bulkRows.push({kind:"new",serial,id});
  stat.textContent=`Checked in ${serial}${model?` (${model})`:""}. Ready for the next one.`; toast(`Checked in ${serial}`);
  renderBulk(); return false;
}

async function doMove(dest, note="", holder="", forId=null){

async function startBarcodeLoop(){

    try{
      const sup=await BarcodeDetector.getSupportedFormats();
      const want=["code_128","code_39","code_93","data_matrix","qr_code","ean_13","upc_a","itf","codabar","pdf417"].filter(f=>sup.includes(f));
      if(want.includes("code_128")||want.includes("data_matrix")) bcDetector=new BarcodeDetector({formats:want});
    }catch{ bcDetector=null; }
  }

  let ZX=null, reader=null;

    if(!camStream) return;
    const v=$("#cam");

      n++;
      if(n===1||n%10===0) $("#ocrstat").textContent=`Looking for a barcode. Camera ${v.videoWidth}x${v.videoHeight}, reader: ${bcDetector?"built-in + backup":"backup"}${reader?"":" (loading)"}. Hold the label inside the box, 4 to 6 inches away.`;

          const vw=v.videoWidth, vh=v.videoHeight, sx=vw*0.03, sw=vw*0.94, sy=vh*0.30, sh=vh*0.40;
          const k=Math.min(2.5, 1600/sw); c.width=Math.round(sw*k); c.height=Math.round(sh*k);

async function readDate(){
  const stat=$("#ocrstat"); const v=$("#cam");
  if(!camStream || !v?.videoWidth){ dateHunt=true; await camStart(); if(camStream) stat.textContent="Line up the manufacture date inside the box, then tap Read date again."; return; }
  stat.textContent="Reading the date…";
  let T; try{ T=await loadTesseract(); }catch{ stat.textContent="Couldn't load the text reader. Type the date instead."; return; }
  try{
    const {data}=await T.recognize(cropPlate(v),"eng",{tessedit_char_whitelist:"0123456789-./()"});
    const d=findDate(data.text||"");
    if(d){ $("#ciMfg").value=d; dateHunt=false; camStop(); stat.textContent=`Manufacture date set to ${d}. Check it against the label.`; }
    else stat.textContent="Couldn't find a date. Move closer to just the date line and try again, or type it.";
  }catch{ stat.textContent="Reading failed. Try again or type the date."; }
}
let dateHunt=false;
async function capture(){
  const stat=$("#ocrstat"); const v=$("#cam"); if(!v?.videoWidth){ stat.textContent="Camera not ready yet."; return; }
  stat.textContent="Reading the plate…";
  let T; try{ T=await loadTesseract(); }catch{ stat.textContent="Couldn't load the text reader. Type the serial instead."; return; }
  try{
    const canvas=cropPlate(v);
    const {data}=await T.recognize(canvas,"eng",{tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-/"});
    const gs=splitGtinSerial(data.text||"");
    if(gs){ $("#ciSerial").value=gs.serial; $("#ciGtin").value=gs.gtin; const m=guessModel(gs.serial,gs.gtin); if(m&&!$("#ciModel").value.trim()) $("#ciModel").value=m;
      stat.textContent=`Read serial ${gs.serial}${m?` (${m})`:""} from the printed line. Check it against the label and check in.`; $("#cand").innerHTML=""; camStop(); return; }
    const cands=rankCandidates(data.text||"");
    if(!cands.length){ stat.textContent="Couldn't make out the serial. Try again with more light, or type it."; return; }
    $("#ciSerial").value=cands[0]; stat.textContent="Best guess filled in. Check it, or tap another reading:";
    $("#cand").innerHTML=cands.map(c=>`<button type="button" data-fill="${esc(c)}">${esc(c)}</button>`).join("");
    camStop();
  }catch(e){ stat.textContent="Reading failed. Try again or type the serial."; }
}

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.area){ state.area=t.dataset.area; try{ localStorage.setItem(AKEY,state.area); }catch{} render(); return; }
  if(t.dataset.tab){ state.tab=t.dataset.tab; state.holder=null; render(); return; }
  if(t.dataset.open){ openDevice(t.dataset.open); return; }
  if(t.dataset.holder){ state.holder={name:t.dataset.holder, kind:t.dataset.kind}; state.tab="devices"; if($("#dlg").open) $("#dlg").close(); render(); return; }
  if(t.dataset.tagfilter){ state.filter=t.dataset.tagfilter; $("#scan").value=state.filter; state.tab="devices"; render(); return; }
  if(t.dataset.fill){ $("#ciSerial").value=t.dataset.fill; $("#ocrstat").textContent="Serial set. Add the model and check in."; return; }
  if(t.dataset.dest){ pickDest=t.dataset.dest; openDevice(state.openId,true); setTimeout(()=>$("#mvNote")?.focus(),30); return; }
  const seg=t.closest("[data-seg]"); if(seg){ seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===t))); return; }
  switch(t.dataset.act){
    case "close": $("#dlg").close(); break;
    case "checkin": openCheckin(); break;
    case "export": exportCsv(); break;
    case "cancelmove": pickDest=null; openDevice(state.openId,true); break;
    case "move": doMove(pickDest, $("#mvNote")?.value.trim()||"", $("#mvWho")?.value.trim()||""); break;
    case "returnback": returnBack(t.dataset.id); break;
    case "tocontam": doMove("contam","Not sanitized per DNR"); break;
    case "dnr": dnrOpen=true; pickDest=null; openDevice(state.openId,true); break;
    case "canceldnr": dnrOpen=false; openDevice(state.openId,true); break;
    case "savednr": saveDnr(); break;
    case "clearholder": state.holder=null; state.tab="holders"; render(); break;
    case "archive": shelfOpen="archive"; pickDest=null; dnrOpen=false; openDevice(state.openId,true); setTimeout(()=>$("#shNote")?.focus(),30); break;
    case "void": shelfOpen="void"; pickDest=null; dnrOpen=false; openDevice(state.openId,true); setTimeout(()=>$("#shNote")?.focus(),30); break;
    case "cancelshelf": shelfOpen=""; openDevice(state.openId,true); break;
    case "doarchive": shelve("archive"); break;
    case "dovoid": shelve("void"); break;
    case "unarchive": shelve("unarchive"); break;
    case "unvoid": { const d=state.devices.get(state.openId); const other=d&&findBySerial(d.serial); if(other&&other!==state.openId){ toast(`Serial ${d.serial} is now used by another unit. Fix that one first.`); break; } shelve("unvoid"); break; }
    case "chooseArea": state.area=""; render(); break;
    case "toggleshelved": state.showShelved=!state.showShelved; render(); break;
    case "edit": editOpen=true; pickDest=null; dnrOpen=false; openDevice(state.openId,true); setTimeout(()=>$("#eSerial")?.focus(),30); break;
    case "canceledit": editOpen=false; openDevice(state.openId,true); break;
    case "saveedit": saveEdit(); break;
    case "camstart": camStart(); break;
    case "camstop": camStop(); break;
    case "capture": capture(); break;
    case "readdate": readDate(); break;
    case "bulk": openBulk(); break;
    case "bkmodel": bulkModel(t.dataset.id); break;
  }
});
document.addEventListener("change", e=>{ if(e.target.matches?.("[data-mfrsel]")){ const o=$("#"+e.target.id+"Other"); if(o){ o.hidden=e.target.value!=="__other"; if(!o.hidden) o.focus(); } return; } const lf=e.target.dataset?.logf; if(lf){ state.log[lf]=e.target.value; render(); return; } const f=e.target.dataset?.field; if(f && state.openId) setField(f, e.target.value); });
document.addEventListener("input", e=>{ if(e.target.id==="ciModel") syncMfr(); });
document.addEventListener("focusout", e=>{ if(e.target.id==="ciSerial") syncYear(); });
document.addEventListener("submit", e=>{ if(e.target.id==="ciForm") submitCheckin(e);
  if(e.target.id==="bkForm"){ e.preventDefault(); const i=$("#bkInput"); const v=i.value; i.value=""; bulkLast.v=""; bulkScan(v,"typed","scanner gun or keyboard"); i.focus(); } });
$("#dlg").addEventListener("close", ()=>{ state.openId=null; stopCam(); bulkMode=false; dateHunt=false; });
$("#dlg").addEventListener("click", e=>{ if(e.target===$("#dlg")) $("#dlg").close(); });
$("#scanForm").addEventListener("submit", e=>{
  e.preventDefault(); const v=$("#scan").value.trim(); if(!v) return;
  const id=findBySerial(v);
  if(id){ openDevice(id); $("#scan").value=""; state.filter=""; }
  else if(state.canWrite) openCheckin(v);
  else toast("No device with that serial.");
});
$("#scan").addEventListener("input", e=>{ state.filter=e.target.value; state.holder=null; if(state.filter){ state.tab="devices"; } render(); });
boot();
</script>
